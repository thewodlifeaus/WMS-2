<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#111111">
<title>Stock tools · TWL WMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/brand.css?v=3">
<link rel="stylesheet" href="/css/tablet.css?v=1">
<style>
  .menu{display:grid;gap:10px}
  .menu button{min-height:84px;font-size:22px;text-align:left;padding:0 20px;display:flex;justify-content:space-between;align-items:center}
  .menu button small{font:600 13px "IBM Plex Mono",monospace;opacity:.75;text-transform:uppercase}
  .row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--rule);padding:10px}
  .row img,.row .noimg{width:64px;height:64px;object-fit:cover;background:var(--panel)}
  .row .q{font:900 30px "IBM Plex Mono",monospace;color:var(--ink);text-align:right}
  .row .q small{display:block;font-size:12px;color:var(--muted)}
  .steps{display:flex;gap:6px;flex-wrap:wrap}
  .steps span{font:700 13px "IBM Plex Mono",monospace;padding:6px 10px;background:var(--panel);border:1px solid var(--rule);color:var(--muted)}
  .steps span.on{background:var(--ink);color:#fff;border-color:var(--ink)} .steps span.done{background:var(--green);color:#fff;border-color:var(--green)}
  .recent{font:500 14px "IBM Plex Mono",monospace;color:var(--muted);display:grid;gap:4px}
</style>
</head>
<body>
<div class="bar"><a class="logo" href="/index.html">TWL</a><span class="mono" style="color:#ccc" id="hdr">STOCK TOOLS</span><span class="mono" style="color:#ccc" id="who"></span></div>
<input id="scan" inputmode="none" autocomplete="off" autocapitalize="characters" spellcheck="false">
<main id="app"></main>
<div class="modal" id="modal" hidden><div class="panel" id="mpanel"></div></div>

<script type="module">
import { sb, requireLogin, signOut, esc, fmt, clearLogin } from "/js/app.js?v=3";
const me = await requireLogin();
if (me?.role === "display") location.href = "/tv.html";
const $ = (id) => document.getElementById(id);
$("who").textContent = (me?.name ?? "").toUpperCase();
const app = $("app"), scan = $("scan");

let ac; const tone = (f, ms, n = 1) => { try { ac ??= new AudioContext(); for (let i = 0; i < n; i++) { const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.value = f; o.connect(g); g.connect(ac.destination); const t = ac.currentTime + i * (ms + 60) / 1000; g.gain.setValueAtTime(.25, t); o.start(t); o.stop(t + ms / 1000); } } catch {} };
const good = () => tone(1300, 70), bad = () => { tone(200, 250, 3); navigator.vibrate?.([200, 80, 200]); }, done = () => { tone(900, 90); setTimeout(() => tone(1400, 160), 120); };

let onScan = null;
const keepFocus = () => { if ($("modal").hidden && !document.activeElement?.matches?.("input:not(#scan)")) scan.focus(); };
setInterval(keepFocus, 800); document.addEventListener("click", () => setTimeout(keepFocus, 50));
scan.addEventListener("keydown", (e) => { if (e.key !== "Enter") return; const v = scan.value.trim(); scan.value = ""; if (v && onScan) onScan(v); });
async function rpc(fn, args) {
  const { data, error } = await sb.rpc(fn, args);
  if (error) { if (/NOT_STAFF|JWT/i.test(error.message)) { await clearLogin(); location.href = "/index.html?next=/stock.html"; } throw error; }
  return data;
}
const msg = (text, kind = "") => { const m = $("msg"); if (m) { m.className = "msg " + kind; m.textContent = text; } };
const ERR = { UNKNOWN_BIN: "Location not recognised.", UNKNOWN_BARCODE: "Product not recognised.", SAME_BIN: "That's the same location.",
  BIN_INACTIVE: "That location is switched off.", CROSS_WAREHOUSE: "Locations are in different warehouses.", BIN_EMPTY: "That location is empty.", BAD_QTY: "Enter a quantity." };
const typeBox = (ph) => `<div class="typebox"><input id="typed" placeholder="${ph}" autocapitalize="characters"><button id="gotype">OK</button></div>`;
function wireType() { const go = () => { const v = $("typed").value.trim(); if (v && onScan) { $("typed").value = ""; onScan(v); } };
  $("gotype").onclick = go; $("typed").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); }); }
const img = (u, w = 128) => u ? `<img src="${esc(u + (u.includes("?") ? "&" : "?") + "width=" + w)}" alt="">` : `<div class="noimg"></div>`;

// ===================== MENU =====================
async function menu(note, kind) {
  $("hdr").textContent = "STOCK TOOLS"; onScan = (v) => lookup(v);
  app.innerHTML = `<div class="menu">
      <button class="signal" id="mMove">Move stock <small>location → location</small></button>
      <button id="mMerge">Merge locations <small>empty one into another</small></button>
      <button class="ghost" id="mLook">What's in a location? <small>scan a location</small></button>
      <button class="ghost" id="mFind">Where is this item? <small>scan a product</small></button></div>
    <div id="msg" class="msg ${kind ?? ""}">${esc(note ?? "Or just scan a location or a product to look it up.")}</div>
    <div class="step">Your moves today</div><div class="recent" id="recent">Loading…</div>
    <div class="btns"><a class="ghost tbtn" href="/pick.html">Back to picking</a><button class="ghost" id="out">Sign out</button></div>`;
  $("mMove").onclick = () => move(); $("mMerge").onclick = () => merge(); $("mLook").onclick = () => lookScreen(); $("mFind").onclick = () => findScreen();
  $("out").onclick = signOut;
  try { const r = await rpc("wms_my_recent_moves", { p_limit: 8 });
    $("recent").innerHTML = r.length ? r.map((m) => `<div>${new Date(m.at).toLocaleTimeString("en-AU", { hour: "numeric", minute: "2-digit" })} · ${esc(m.sku)} ×${m.qty} · ${esc(m.from ?? "?")} → ${esc(m.to ?? "?")}${m.kind === "merge" ? " (merge)" : ""}</div>`).join("") : "<div>None yet.</div>";
  } catch { $("recent").textContent = ""; }
}
async function lookup(v) {   // scanned from the menu: location first, then product
  const b = await rpc("wms_bin_contents", { p_bin: v });
  if (b.ok) return showBin(b);
  return showItem(v);
}

// ===================== LOOK UP =====================
function lookScreen() { $("hdr").textContent = "WHAT'S IN A LOCATION";
  app.innerHTML = `<div class="huge" style="font-size:40px">Scan a location</div>${typeBox("or type it, eg LG-04-02")}<div id="msg" class="msg"></div><button class="ghost" id="back">Back</button>`;
  wireType(); $("back").onclick = () => menu();
  onScan = async (v) => { try { const b = await rpc("wms_bin_contents", { p_bin: v }); if (!b.ok) { bad(); return msg(`${v}: location not recognised.`, "bad"); } good(); showBin(b); } catch (e) { bad(); msg(e.message, "bad"); } };
}
function showBin(b) {
  $("hdr").textContent = b.bin.code;
  app.innerHTML = `<div class="loc"><div class="step">${esc(b.bin.type.toUpperCase())}${b.bin.active ? "" : " · SWITCHED OFF"} · ${b.items.length} SKU${b.items.length === 1 ? "" : "S"} · ${fmt(b.units)} UNITS</div><div class="big">${esc(b.bin.code)}</div></div>
    <div class="list">${b.items.length ? b.items.map((i) => `<div class="row">${img(i.image_url)}
        <div><b>${esc(i.name)}</b> ${i.variant ? `<span class="mono">${esc(i.variant)}</span>` : ""}<div class="sku">${esc(i.sku)}</div>
        ${i.other_bins.length ? `<div class="split">Also in: ${i.other_bins.slice(0, 4).map((o) => `${esc(o.bin)} (${o.qty})`).join(", ")}${i.other_bins.length > 4 ? "…" : ""}</div>` : ""}</div>
        <div class="q">${i.on_hand}${i.allocated ? `<small>${i.allocated} reserved</small>` : ""}</div></div>`).join("") : `<div class="card">Empty.</div>`}</div>
    <div id="msg" class="msg">Scan another location or product, or:</div>
    <div class="btns"><button class="signal" id="mv">Move from here</button><button id="mg">Merge this location</button></div>
    <button class="ghost" id="back">Back</button>`;
  $("mv").onclick = () => move(b.bin.code); $("mg").onclick = () => merge(b.bin.code); $("back").onclick = () => menu();
  onScan = (v) => lookup(v);
}
function findScreen() { $("hdr").textContent = "WHERE IS THIS ITEM";
  app.innerHTML = `<div class="huge" style="font-size:40px">Scan a product</div>${typeBox("or type a SKU")}<div id="msg" class="msg"></div><button class="ghost" id="back">Back</button>`;
  wireType(); $("back").onclick = () => menu(); onScan = (v) => showItem(v);
}
async function showItem(v) {
  try {
    const r = await rpc("wms_search_inventory", { p_query: v, p_limit: 5 });
    if (!r.length) { bad(); return msg(`${v}: not recognised as a location or product.`, "bad"); }
    good(); const p = r[0];
    $("hdr").textContent = p.sku;
    app.innerHTML = `<div class="card prod">${img(p.image_url, 280)}<div><div class="pname">${esc(p.name)}</div>${p.variant ? `<div class="pvar">${esc(p.variant)}</div>` : ""}<div class="psku">${esc(p.sku)}</div>
        <div class="stat" style="margin-top:8px"><div><span class="mono">On hand</span><b>${fmt(p.on_hand)}</b></div><div><span class="mono">Available</span><b>${fmt(p.available)}</b></div></div></div></div>
      <div class="step">Locations</div>
      <div class="list">${p.bins.length ? p.bins.map((b) => `<div class="row"><div class="mono">${esc((b.type ?? "").toUpperCase())}</div><div class="bin" style="font:900 26px 'IBM Plex Mono',monospace">${esc(b.bin)}</div>
        <div class="q">${b.qty}${b.allocated ? `<small>${b.allocated} reserved</small>` : ""}</div></div>`).join("") : `<div class="card">No stock in any location.</div>`}</div>
      <div id="msg" class="msg">Scan another product or location.</div><button class="ghost" id="back">Back</button>`;
    $("back").onclick = () => menu(); onScan = (x) => lookup(x);
  } catch (e) { bad(); msg(e.message, "bad"); }
}

// ===================== MOVE: from -> product -> qty -> to =====================
function move(fromCode) {
  const m = { from: fromCode ?? null, product: null, sku: null, qty: null, max: null };
  const STEPS = ["From", "Product", "Qty", "To"];
  const draw = (text, kind) => {
    const step = !m.from ? 0 : !m.product ? 1 : !m.qty ? 2 : 3;
    $("hdr").textContent = "MOVE STOCK";
    app.innerHTML = `<div class="steps">${STEPS.map((s, i) => `<span class="${i < step ? "done" : i === step ? "on" : ""}">${i + 1}. ${s}</span>`).join("")}</div>
      ${m.from ? `<div class="loc ok"><div class="step">From</div><div class="big" style="font-size:44px">${esc(m.from)}</div></div>` : ""}
      ${m.product ? `<div class="card"><div class="step">Product</div><div class="pname">${esc(m.product.name)}</div>${m.product.variant ? `<div class="pvar">${esc(m.product.variant)}</div>` : ""}<div class="psku">${esc(m.sku)} · ${m.max} free here${m.reserved ? ` · ${m.reserved} reserved (can't move)` : ""}</div></div>` : ""}
      ${m.qty ? `<div class="card"><div class="step">Quantity</div><div class="huge" style="font-size:56px">${m.qty}</div></div>` : ""}
      <div class="card"><div class="huge" style="font-size:36px">${["Scan the location you're taking stock FROM", "Scan the product", "How many?", "Scan the location you're putting it INTO"][step]}</div>
        ${step === 2 ? "" : typeBox(["or type the location", "or type the SKU", "", "or type the location"][step])}</div>
      <div id="msg" class="msg ${kind ?? ""}">${esc(text ?? "")}</div>
      <div class="btns"><button class="ghost" id="cancel">Cancel</button>${step > 0 ? `<button class="ghost" id="backstep">Back a step</button>` : "<span></span>"}</div>`;
    if (step !== 2) wireType();
    $("cancel").onclick = () => menu("Move cancelled.");
    $("backstep")?.addEventListener("click", () => { if (m.qty) m.qty = null; else if (m.product) m.product = null; else m.from = null; draw(); });
    if (step === 2) qtyPad(m.max, (n) => { m.qty = n; draw(); });
  };
  onScan = async (v) => {
    try {
      if (!m.from) {
        const b = await rpc("wms_bin_contents", { p_bin: v });
        if (!b.ok) { bad(); return draw(`${v}: location not recognised.`, "bad"); }
        if (!b.items.length) { bad(); return draw(`${b.bin.code} is empty.`, "bad"); }
        good(); m.from = b.bin.code; m.items = b.items; return draw();
      }
      if (!m.product) {
        const r = await rpc("wms_search_inventory", { p_query: v, p_limit: 1 });
        const p = r[0];
        const here = p && (m.items ?? []).find((i) => i.sku === p.sku);
        if (!p) { bad(); return draw(`${v}: product not recognised.`, "bad"); }
        if (!here) { bad(); return draw(`${p.sku} is not in ${m.from}.`, "bad"); }
        if (here.free < 1) { bad(); return draw(`All ${here.on_hand} of ${p.sku} in ${m.from} are reserved for a cart.`, "bad"); }
        good(); m.product = p; m.sku = p.sku; m.max = here.free; m.reserved = here.allocated; return draw();
      }
      if (!m.qty) return;
      const r = await rpc("wms_move_stock", { p_from_bin: m.from, p_product_barcode: m.sku, p_qty: m.qty, p_to_bin: v });
      if (!r.ok) { bad(); return draw(r.error === "INSUFFICIENT_STOCK" ? `Only ${r.available} free in ${m.from}.` : (ERR[r.error] ?? r.error) + (r.scanned ? ` (${r.scanned})` : ""), "bad"); }
      done();
      menu(`✓ Moved ${r.qty} × ${r.sku}: ${r.from} (now ${r.from_after}) → ${r.to} (now ${r.to_after}).`, "good");
    } catch (e) { bad(); draw(e.message, "bad"); }
  };
  draw(fromCode ? "Scan the product." : "");
}
function qtyPad(max, cb) {
  let q = String(max);
  const draw = () => { $("mpanel").innerHTML = `<h2>How many?</h2><div class="qtyshow">${q || "0"}</div><div class="mono" style="text-align:center">${max} FREE IN THIS LOCATION</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map((n) => `<button data-n="${n}">${n}</button>`).join("")}<button data-n="C">Clear</button><button data-n="0">0</button><button data-n="A">All ${max}</button></div>
    <div class="btns"><button class="ghost" id="qno">Cancel</button><button class="signal" id="qyes">Move ${q || 0}</button></div>`;
    $("mpanel").onclick = (e) => { const b = e.target.closest("[data-n]"); if (!b) return; const n = b.dataset.n;
      q = n === "C" ? "" : n === "A" ? String(max) : (q === String(max) ? n : (q + n).replace(/^0+/, "")); draw(); };
    $("qno").onclick = () => { $("modal").hidden = true; menu("Move cancelled."); };
    $("qyes").onclick = () => { const n = Number(q); if (!n) return; if (n > max) { q = String(max); return draw(); } $("modal").hidden = true; cb(n); }; };
  draw(); $("modal").hidden = false;
}

// ===================== MERGE: from -> to -> confirm =====================
function merge(fromCode) {
  let from = null, items = [];
  const draw = (text, kind) => {
    $("hdr").textContent = "MERGE LOCATIONS";
    app.innerHTML = `<div class="steps"><span class="${from ? "done" : "on"}">1. Empty this one</span><span class="${from ? "on" : ""}">2. Into this one</span></div>
      ${from ? `<div class="loc ok"><div class="step">Empty</div><div class="big" style="font-size:44px">${esc(from)}</div></div>
        <div class="list">${items.map((i) => `<div class="row">${img(i.image_url)}<div><b>${esc(i.name)}</b><div class="sku">${esc(i.sku)}</div></div><div class="q">${i.free}${i.allocated ? `<small>${i.allocated} reserved stay</small>` : ""}</div></div>`).join("")}</div>` : ""}
      <div class="card"><div class="huge" style="font-size:34px">${from ? "Scan the location to move it all INTO" : "Scan the location to EMPTY"}</div>${typeBox("or type the location")}</div>
      <div id="msg" class="msg ${kind ?? ""}">${esc(text ?? "")}</div>
      <div class="btns"><button class="ghost" id="cancel">Cancel</button><span></span></div>`;
    wireType(); $("cancel").onclick = () => menu("Merge cancelled.");
  };
  const loadFrom = async (v) => {
    const b = await rpc("wms_bin_contents", { p_bin: v });
    if (!b.ok) { bad(); return draw(`${v}: location not recognised.`, "bad"); }
    if (!b.items.length) { bad(); return draw(`${b.bin.code} is already empty.`, "bad"); }
    good(); from = b.bin.code; items = b.items; draw(`${b.items.length} SKU(s), ${b.units} units.`);
  };
  onScan = async (v) => {
    try {
      if (!from) return loadFrom(v);
      const to = await rpc("wms_bin_contents", { p_bin: v });
      if (!to.ok) { bad(); return draw(`${v}: location not recognised.`, "bad"); }
      if (to.bin.code === from) { bad(); return draw("That's the same location.", "bad"); }
      const units = items.reduce((a, i) => a + i.free, 0);
      $("mpanel").innerHTML = `<h2>Merge ${esc(from)} into ${esc(to.bin.code)}?</h2>
        <p style="font-size:18px">${units} unit(s) of ${items.filter((i) => i.free > 0).length} SKU(s) move into <b>${esc(to.bin.code)}</b> (${to.items.length} SKU(s) there now).
        ${items.some((i) => i.allocated) ? "Stock reserved for a cart stays where it is." : ""}</p>
        <div class="btns"><button class="ghost" id="no">Cancel</button><button class="signal" id="yes">Merge</button></div>`;
      $("modal").hidden = false;
      $("no").onclick = () => { $("modal").hidden = true; };
      $("yes").onclick = async () => { $("modal").hidden = true;
        const r = await rpc("wms_merge_bins", { p_from_bin: from, p_to_bin: to.bin.code, p_confirmed: true });
        if (!r.ok) { bad(); return draw(ERR[r.error] ?? r.error, "bad"); }
        done(); menu(`✓ Merged ${r.units} unit(s) from ${r.from} into ${r.to}.${r.kept.length ? ` Kept back (reserved): ${r.kept.map((k) => `${k.sku} ×${k.qty}`).join(", ")}.` : ""}`, "good"); };
    } catch (e) { bad(); draw(e.message, "bad"); }
  };
  if (fromCode) loadFrom(fromCode); else draw();
}

const start = new URLSearchParams(location.search).get("do");
start === "move" ? move() : start === "merge" ? merge() : menu();
</script>
</body>
</html>
